version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: weekly-report-backend
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-weekly_report}
    ports:
      - "3001:3001"
    restart: unless-stopped
    networks:
      - weekly-report

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: weekly-report-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - weekly-report

networks:
  weekly-report:
    driver: bridge
